# Adapted from @tscircuit/plop's bun-pver-release workflow.
# Releases are GitHub release assets, not npm packages: consumers depend on
# https://github.com/tscircuit/signal-integrity-pipeline/releases/download/v<version>/tscircuit-signal-integrity-pipeline-<version>.tgz
name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global pver@0.0.43
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:package
      - name: Tag the next version
        # git + package-json only: bump the version in the tag commit and push
        # the tag. No npm publication and no push to main.
        run: pver release --git --package-json
        env:
          GITHUB_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          git checkout --detach "$TAG"
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          pnpm install --frozen-lockfile
          # Pack into an empty directory and upload whatever npm produced, so the
          # asset name always follows the package name in package.json.
          PACK_DIR="$RUNNER_TEMP/pack"
          rm -rf "$PACK_DIR" && mkdir -p "$PACK_DIR"
          npm pack --pack-destination "$PACK_DIR"
          TARBALL=$(ls "$PACK_DIR"/*.tgz)
          gh release create "$TAG" "$TARBALL" \
            --verify-tag --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
